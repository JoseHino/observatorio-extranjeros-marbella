<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatorio de Extranjeros Residentes · Marbella</title>
<meta name="description" content="Cuadro de mando de la Concejalía de Extranjeros Residentes de Marbella: población extranjera por nacionalidad y distrito, derecho a voto, empleo y actividad de la Concejalía.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;650&display=swap" rel="stylesheet">

<!-- Kit: no se toca por observatorio -->
<link rel="stylesheet" href="assets/obs.css">

<!-- Ajustes de ESTE observatorio: color de marca (turquesa de la Concejalía)
     y los pocos estilos de los listados de eventos y prensa. -->
<style>
  :root { --brand: #157f9e; --brand-ink: #0f6580; --brand-soft: #e5f3f7; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --brand: #2aa3c6; --brand-ink: #6cc6e0; --brand-soft: #10303a; }
  }
  :root[data-theme="dark"] { --brand: #2aa3c6; --brand-ink: #6cc6e0; --brand-soft: #10303a; }

  /* Barra de filtros de eventos: va en el hueco de "nota" de la sección. */
  .obs-note:has(.ev-filtros) { background: none; border: 0; padding: 0; box-shadow: none; }
  .ev-filtros { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 16px; }
  .ev-filtros .obs-select { min-width: 120px; max-width: 100%; }
  .ev-filtros .obs-btn { margin-left: auto; }

  .ev-lista { padding: 6px 17px 14px; overflow-x: auto; max-height: 560px; overflow-y: auto; }
  .ev-texto { max-height: none; }
  table.ev-tabla td { white-space: normal; text-align: left; vertical-align: top; }
  table.ev-tabla th { text-align: left; }
  table.ev-tabla td:first-child { white-space: nowrap; }
  table.ev-tabla td.ev-t { min-width: 260px; color: var(--ink); }
  .ev-aprox, .ev-nota { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
    color: var(--ink-mut); border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 5px; margin-left: 4px; white-space: nowrap; }
  .ev-nota { cursor: help; color: var(--brand-ink); border-color: var(--brand); }
  .ev-vacio { color: var(--ink-mut); padding: 18px 0; }
  .ev-inc { margin: 4px 0 4px 18px; padding: 0; line-height: 1.55; font-size: 13px; color: var(--ink-2); }
  .ev-inc li { margin: 0 0 8px; }
  .cov { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 10px; }
  .cov.si { color: #0a7d0a; background: #e9f7e9; }
  .cov.no { color: var(--ink-mut); }
  :root[data-theme="dark"] .cov.si { color: #4fc44f; background: #102110; }
  @media (max-width: 640px) { .ev-filtros .obs-btn { margin-left: 0; } .ev-filtros label { flex: 1 1 100%; justify-content: space-between; } }
</style>
</head>
<body>

<div id="obs-app"></div>

<!-- Librería de gráficas -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<!-- Kit -->
<script src="assets/obs-charts.js"></script>
<script src="assets/obs-ui.js"></script>
<!-- Datos públicos (los escribe pipeline/build_data.py) -->
<script src="data/data.js"></script>
<!-- Datos internos de la Concejalía (se editan a mano) -->
<script src="data/concejalia.js"></script>
<!-- Declaración de ESTE observatorio -->
<script src="app.js"></script>

</body>
</html>
